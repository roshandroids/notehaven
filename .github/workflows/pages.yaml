name: Deploy website
# Publishes the Flutter web build to https://notehaven.rsprojects.dev/ on every push to main.
# The custom domain comes from app/web/CNAME (copied into the artifact by flutter build web).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build
        working-directory: app
      - name: Build web
        working-directory: app
        run: |
          flutter build web --release --base-href /
          test -f build/web/CNAME
          cp build/web/index.html build/web/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
