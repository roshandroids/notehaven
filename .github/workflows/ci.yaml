name: CI
# PRs only: tests. Merging to main deploys via pages.yaml (no second test/build run).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - run: FLUTTER=flutter DART=dart scripts/verify.sh
