name: notehaven_app
description: Notehaven — offline-first site log app (iOS, Android, web, macOS, Windows, Linux).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  animations: ^3.0.0
  drift: 2.34.0
  drift_flutter: ^0.3.1
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.0.0
  flutter_slidable: ^4.0.3
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  intl: ^0.20.2
  notehaven_core:
    path: ../packages/notehaven_core
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  # shortcut: drift_dev is capped below 2.34.6 (needs analyzer >=13, but test/flutter_test pin
  # analyzer <13); drift is pinned to the same range. Lift when Flutter's pinned test_api allows it.
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.34.0
  build_runner: ^2.5.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
